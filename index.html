<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="漫画英雄TRPG车卡器 - 一页式竖版角色卡生成系统">
    <meta name="theme-color" content="#1b1938">
    <title>漫画英雄 TRPG 车卡器</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/views.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body>
    <div id="app">
        <header class="app-header">
            <div class="header-content">
                <div class="logo" id="logo" title="点击查看作者信息" style="cursor: pointer;">
                    <h1>漫画英雄：<span class="subtitle">英雄快速登场工具</span></h1>
                </div>
                <nav class="main-nav">
                    <button class="nav-btn" data-view="editor" aria-label="角色编辑">
                        <span class="nav-icon">✍️</span>
                        <span class="nav-text">编辑角色</span>
                    </button>
                    <button class="nav-btn active" data-view="saved" aria-label="已存角色">
                        <span class="nav-icon">📋</span>
                        <span class="nav-text">英雄名录</span>
                    </button>
                </nav>
            </div>
        </header>

        <main class="main-content one-page-app">
            <!-- 一页式角色卡编辑器 -->
            <section id="editor-view" class="view">
                <div class="controls-overlay">
                    <div class="action-btns" style="margin-left: auto; display: flex; gap: 8px;">
                        <button class="btn btn-sm btn-info" onclick="app.creationFlow.exportAsImage()">🖼️ 导出图片</button>
                        <button class="btn btn-sm btn-primary" onclick="app.creationFlow.saveCurrentCharacter()">💾
                            保存英雄</button>
                    </div>
                </div>

                <div id="character-sheet" class="sheet-container fade-in">
                    <!-- 动态生成一页式内容 -->
                    <div class="loading-state">
                        <p>正在同步英雄档案...</p>
                    </div>
                </div>
            </section>

            <!-- 已存角色名录 -->
            <section id="saved-view" class="view active">
                <div class="section-header">
                    <h2>英雄名录</h2>
                    <div class="header-actions" style="display: flex; gap: 8px;">
                        <button class="btn btn-sm btn-primary" onclick="app.viewManager.switchView('editor'); app.creationFlow.start();">➕ 创建英雄</button>
                        <button class="btn btn-sm btn-info" id="import-image-btn">🖼️ 图片导入</button>
                        <input type="file" id="import-image-file" hidden accept="image/png">
                        <button class="btn btn-sm btn-outline" id="import-characters-btn">📥 JSON导入</button>
                        <input type="file" id="import-file-input" hidden accept=".json">
                    </div>
                </div>

                <div class="filter-bar" style="margin-bottom: 20px; display: flex; gap: 10px;">
                    <input type="text" id="search-characters" placeholder="搜索英雄..."
                        style="flex: 1;">
                    <select id="sort-characters" style="flex: 0 0 130px;">
                        <option value="newest">最近创建</option>
                        <option value="name">名称排序</option>
                    </select>
                </div>

                <div id="saved-characters-list" class="saved-characters-list grid-list"></div>
            </section>


        </main>

        <footer class="app-footer">
            <details class="footer-details">
                <summary>漫画英雄 TRPG 车卡器 · 一页式极简版 · 制作者：不咕鸟</summary>
                <div class="footer-expanded-content">
                    成都秘密基地TRPG俱乐部欢迎每一位对跑团、桌游、战锤以及各种社交活动有兴趣的新老朋友加入。<br>
                    店长不咕鸟（基德）热衷带新和尝试新规则，也同样希望结识更多志同道合，愿意为国内TRPG做开源工具的朋友。<br>
                    项目交流和反馈欢迎加群：<strong>261751459</strong>
                </div>
            </details>
            <p style="font-size: 11px; margin-top: 5px; opacity: 0.8;">
                本工具为非盈利性质的粉丝自制应用。<br>
                《ICONS》原作者：<a href="https://stevekenson.com/icons/" target="_blank" style="color: inherit; text-decoration: underline;">Steve Kenson</a> | 中文代理：<a href="https://labyrinth-rpg.com/%E7%8B%AC%E7%AB%8B%E4%BD%B3%E4%BD%9C" target="_blank" style="color: inherit; text-decoration: underline;">乐博睿</a><br>
                所涉及的游戏规则著作权归原权利人所有。请支持正版实体书及电子版。
            </p>
        </footer>
    </div>

    <!-- 模态框 & Toast -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title"></h3><button class="modal-close" onclick="app.closeModal()">&times;</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
            <div id="modal-footer" class="modal-footer"></div>
        </div>
    </div>
    <div id="toast-container" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script type="module" src="js/main.js?v=7"></script>
</body>

</html>
